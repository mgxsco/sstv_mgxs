<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSTV TX - Transmitter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 1rem;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .header h1 {
            font-size: 1.5rem;
            color: #ff6b6b;
        }
        .back-link {
            color: #8892b0;
            text-decoration: none;
        }
        .back-link:hover { color: #fff; }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .panel h2 {
            font-size: 1rem;
            color: #8892b0;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .image-area {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .image-box {
            flex: 1;
            min-width: 300px;
            aspect-ratio: 4/3;
            background: rgba(0, 0, 0, 0.3);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            overflow: hidden;
            position: relative;
        }
        .image-box:hover {
            border-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }
        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-box .placeholder {
            text-align: center;
            color: #8892b0;
        }
        .image-box .placeholder span {
            font-size: 3rem;
            display: block;
            margin-bottom: 0.5rem;
        }
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        button {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255, 107, 107, 0.4); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        button.secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: none;
        }
        .status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.1);
        }
        .status.transmitting {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .waveform {
            height: 100px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .waveform canvas {
            width: 100%;
            height: 100%;
        }
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
            width: 0%;
            transition: width 0.1s linear;
        }
        .info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.75rem;
            border-radius: 8px;
        }
        .info-item label {
            font-size: 0.75rem;
            color: #8892b0;
            display: block;
        }
        .info-item value {
            font-size: 1.1rem;
            font-weight: 600;
        }
        input[type="file"] { display: none; }
        video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📡 SSTV Transmitter</h1>
        <a href="/" class="back-link">← Back to Home</a>
    </div>

    <div class="container">
        <div class="panel">
            <h2>Source Image</h2>
            <div class="image-area">
                <div class="image-box" id="imageBox" onclick="document.getElementById('fileInput').click()">
                    <div class="placeholder" id="placeholder">
                        <span>📷</span>
                        <p>Click to upload image<br>or drag & drop</p>
                    </div>
                    <img id="previewImage" style="display: none;">
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*">

            <div class="controls" style="margin-top: 1rem;">
                <button id="cameraBtn" class="secondary" onclick="toggleCamera()">
                    <span>📸</span> Use Camera
                </button>
                <button id="captureBtn" class="secondary" style="display: none;" onclick="capturePhoto()">
                    <span>📷</span> Capture
                </button>
            </div>
            <video id="cameraVideo" style="display: none;" autoplay playsinline></video>
        </div>

        <div class="panel">
            <h2>Transmission</h2>
            <div class="controls">
                <button id="transmitBtn" onclick="startTransmission()" disabled>
                    <span>📡</span> Transmit
                </button>
                <button id="stopBtn" onclick="stopTransmission()" disabled class="secondary">
                    <span>⏹</span> Stop
                </button>
                <button id="broadcastBtn" onclick="broadcastToReceivers()" disabled class="secondary">
                    <span>📢</span> Broadcast to Receivers
                </button>
                <div class="status" id="status">Ready</div>
            </div>

            <div class="waveform">
                <canvas id="waveformCanvas"></canvas>
            </div>
            <div class="progress-bar">
                <div class="fill" id="progressFill"></div>
            </div>

            <div class="info">
                <div class="info-item">
                    <label>Duration</label>
                    <value id="duration">~36s</value>
                </div>
                <div class="info-item">
                    <label>Sample Rate</label>
                    <value id="sampleRate">44100 Hz</value>
                </div>
                <div class="info-item">
                    <label>Progress</label>
                    <value id="progress">0%</value>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let socket;
        let audioContext;
        let audioBuffer;
        let sourceNode;
        let analyser;
        let isTransmitting = false;
        let imageLoaded = false;
        let cameraStream = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initSocket();
            initDragDrop();
            initFileInput();
            initWaveform();
        });

        function initSocket() {
            socket = io();

            socket.on('connect', () => {
                console.log('Connected to server');
            });

            socket.on('encoded_audio', (data) => {
                console.log('Received encoded audio:', data.num_samples, 'samples');
                loadAudioFromBase64(data.audio, data.sample_rate);
            });

            socket.on('error', (data) => {
                alert('Error: ' + data.message);
                setStatus('Error');
            });
        }

        function initDragDrop() {
            const box = document.getElementById('imageBox');

            box.addEventListener('dragover', (e) => {
                e.preventDefault();
                box.style.borderColor = '#ff6b6b';
            });

            box.addEventListener('dragleave', () => {
                box.style.borderColor = '';
            });

            box.addEventListener('drop', (e) => {
                e.preventDefault();
                box.style.borderColor = '';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    loadImage(file);
                }
            });
        }

        function initFileInput() {
            document.getElementById('fileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    loadImage(file);
                }
            });
        }

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = document.getElementById('previewImage');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('placeholder').style.display = 'none';
                imageLoaded = true;
                document.getElementById('transmitBtn').disabled = false;
                document.getElementById('broadcastBtn').disabled = false;

                // Stop camera if active
                if (cameraStream) {
                    toggleCamera();
                }
            };
            reader.readAsDataURL(file);
        }

        async function toggleCamera() {
            const video = document.getElementById('cameraVideo');
            const cameraBtn = document.getElementById('cameraBtn');
            const captureBtn = document.getElementById('captureBtn');
            const imageBox = document.getElementById('imageBox');

            if (cameraStream) {
                // Stop camera
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
                video.style.display = 'none';
                cameraBtn.innerHTML = '<span>📸</span> Use Camera';
                captureBtn.style.display = 'none';
                imageBox.style.display = 'flex';
            } else {
                // Start camera
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: 640, height: 480 }
                    });
                    video.srcObject = cameraStream;
                    video.style.display = 'block';
                    imageBox.style.display = 'none';
                    cameraBtn.innerHTML = '<span>📸</span> Stop Camera';
                    captureBtn.style.display = 'inline-flex';
                } catch (err) {
                    alert('Could not access camera: ' + err.message);
                }
            }
        }

        function capturePhoto() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            canvas.toBlob((blob) => {
                loadImage(blob);
                toggleCamera();
            }, 'image/jpeg', 0.9);
        }

        function initWaveform() {
            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            ctx.scale(2, 2);

            // Draw empty waveform
            ctx.fillStyle = 'rgba(255, 107, 107, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawWaveform() {
            if (!analyser) return;

            const canvas = document.getElementById('waveformCanvas');
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteTimeDomainData(dataArray);

            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#ff6b6b';
            ctx.beginPath();

            const sliceWidth = width / dataArray.length;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * height / 2;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                x += sliceWidth;
            }

            ctx.stroke();

            if (isTransmitting) {
                requestAnimationFrame(drawWaveform);
            }
        }

        async function startTransmission() {
            if (!imageLoaded) return;

            setStatus('Encoding...', true);

            // Get image data
            const img = document.getElementById('previewImage');
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 320, 240);

            // Convert to base64
            const imageData = canvas.toDataURL('image/png').split(',')[1];

            // Send to server for encoding
            socket.emit('encode_image', { image: imageData });

            // Wait for response (handled in socket event)
        }

        async function loadAudioFromBase64(base64Audio, sampleRate) {
            try {
                // Decode base64 to array buffer
                const binaryString = atob(base64Audio);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // Convert to Float32Array
                const float32Array = new Float32Array(bytes.buffer);

                // Create audio context and buffer
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
                audioBuffer = audioContext.createBuffer(1, float32Array.length, sampleRate);
                audioBuffer.getChannelData(0).set(float32Array);

                // Store for broadcasting
                window.lastEncodedAudio = base64Audio;
                window.lastSampleRate = sampleRate;

                // Start playback
                playAudio();

            } catch (err) {
                console.error('Error loading audio:', err);
                setStatus('Error loading audio');
            }
        }

        function playAudio() {
            if (!audioBuffer) return;

            isTransmitting = true;
            document.getElementById('transmitBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;

            // Create source and analyser
            sourceNode = audioContext.createBufferSource();
            sourceNode.buffer = audioBuffer;

            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;

            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);

            // Update progress
            const duration = audioBuffer.duration;
            const startTime = audioContext.currentTime;

            const updateProgress = () => {
                if (!isTransmitting) return;

                const elapsed = audioContext.currentTime - startTime;
                const percent = Math.min(100, (elapsed / duration) * 100);

                document.getElementById('progressFill').style.width = percent + '%';
                document.getElementById('progress').textContent = Math.round(percent) + '%';

                if (percent < 100) {
                    requestAnimationFrame(updateProgress);
                }
            };

            sourceNode.onended = () => {
                isTransmitting = false;
                setStatus('Complete');
                document.getElementById('transmitBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progress').textContent = '100%';
            };

            sourceNode.start(0);
            setStatus('Transmitting...', true);
            updateProgress();
            drawWaveform();
        }

        function stopTransmission() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode = null;
            }
            isTransmitting = false;
            setStatus('Stopped');
            document.getElementById('transmitBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function broadcastToReceivers() {
            if (!window.lastEncodedAudio) {
                alert('Please transmit first to encode the image');
                return;
            }

            socket.emit('broadcast_audio', {
                audio: window.lastEncodedAudio,
                sample_rate: window.lastSampleRate
            });

            setStatus('Broadcast sent!');
            setTimeout(() => setStatus('Ready'), 2000);
        }

        function setStatus(text, transmitting = false) {
            const status = document.getElementById('status');
            status.textContent = text;
            status.className = 'status' + (transmitting ? ' transmitting' : '');
        }
    </script>
</body>
</html>
