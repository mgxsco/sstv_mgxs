<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSTV Robot36 - RX | MGXS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="https://mgxs.co" class="logo">
            <img src="https://images.squarespace-cdn.com/content/v1/6571e36aba71cb56d944e911/a11fb335-c0f5-42cf-bc6c-acf2330c6c48/MGXS_LOGO_BK.png" alt="MGXS">
        </a>
        <nav class="nav">
            <a href="tx.html">TX</a>
            <a href="rx.html" class="active">RX</a>
        </nav>
    </header>

    <main class="main">
        <h1 class="title">SSTV RECEIVE</h1>

        <div class="section">
            <div class="image-box">
                <canvas id="rx-canvas" width="320" height="240"></canvas>
                <div class="placeholder" id="rx-placeholder">Decoded image</div>
                <div class="line-indicator" id="line-indicator" style="display:none;">0/240</div>
            </div>

            <input type="file" id="audio-file" accept="audio/*,.wav,.mp3,.ogg,.m4a">

            <div class="controls">
                <button id="btn-start">Start</button>
                <button onclick="document.getElementById('audio-file').click()">Load Audio</button>
                <button id="btn-save" disabled>Save Image</button>
                <button id="btn-clear">Clear</button>
            </div>

            <div class="progress">
                <div class="progress-fill" id="rx-progress"></div>
            </div>

            <div class="status" id="rx-status">Click Start to listen for signal</div>

            <div class="slider-row">
                <label>Phase</label>
                <input type="range" id="phase-slider" min="-20000" max="20000" value="0">
                <span class="value" id="phase-value">0</span>
            </div>

            <div class="slider-row">
                <label>Skew</label>
                <input type="range" id="skew-slider" min="-50" max="50" value="0" step="0.5">
                <span class="value" id="skew-value">0</span>
            </div>
        </div>
    </main>

    <footer class="footer">
        "I'm now much closer to the idea of achieving a true dialogue with machines than I have ever been."
    </footer>

    <script src="sstv.js"></script>
    <script src="rx.js"></script>
</body>
</html>
